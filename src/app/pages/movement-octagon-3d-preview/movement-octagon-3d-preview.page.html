<ion-content fullscreen class="octagon-page">
  <main class="octagon-shell">
    <header>
      <button type="button" aria-label="Назад" (click)="goBack()">‹</button>
      <div><small>Three.js · GLB</small><h1>Морковь на маршруте</h1></div>
      <b>3D</b>
    </header>

    <section #viewport class="viewport" aria-label="3D-персонаж движется по восьмигранной траектории"></section>
    <p class="status">{{ status() }}</p>

    <section class="controls">
      <div class="speed-row">
        <label for="octagon-3d-speed">Скорость</label>
        <input id="octagon-3d-speed" type="range" min="0.25" max="1.5" step="0.05" [value]="speed()" (input)="setSpeed($event)" />
        <output>{{ speed().toFixed(2) }}×</output>
      </div>
      <button class="play" type="button" (click)="togglePlay()">{{ isPlaying() ? 'ПАУЗА' : 'ПРОДОЛЖИТЬ' }}</button>

      <details [open]="equipmentReady()">
        <summary>Настройка снаряжения</summary>
        <div class="equipment-tabs">
          <button type="button" [class.active]="selectedEquipment === 'spear'" (click)="selectedEquipment = 'spear'">КОПЬЁ</button>
          <button type="button" [class.active]="selectedEquipment === 'shield'" (click)="selectedEquipment = 'shield'">ЩИТ</button>
        </div>
        <div class="sliders">
          <label>X <input type="range" min="-0.5" max="0.5" step="0.005" [(ngModel)]="currentEquipment.x" (input)="applyEquipmentTransform()"><output>{{ currentEquipment.x }}</output></label>
          <label>Y <input type="range" min="-0.5" max="0.5" step="0.005" [(ngModel)]="currentEquipment.y" (input)="applyEquipmentTransform()"><output>{{ currentEquipment.y }}</output></label>
          <label>Z <input type="range" min="-0.5" max="0.5" step="0.005" [(ngModel)]="currentEquipment.z" (input)="applyEquipmentTransform()"><output>{{ currentEquipment.z }}</output></label>
          <label>RX <input type="range" min="-180" max="180" step="1" [(ngModel)]="currentEquipment.rx" (input)="applyEquipmentTransform()"><output>{{ currentEquipment.rx }}°</output></label>
          <label>RY <input type="range" min="-180" max="180" step="1" [(ngModel)]="currentEquipment.ry" (input)="applyEquipmentTransform()"><output>{{ currentEquipment.ry }}°</output></label>
          <label>RZ <input type="range" min="-180" max="180" step="1" [(ngModel)]="currentEquipment.rz" (input)="applyEquipmentTransform()"><output>{{ currentEquipment.rz }}°</output></label>
          <label>Размер <input type="range" min="0.2" max="2" step="0.02" [(ngModel)]="currentEquipment.scale" (input)="applyEquipmentTransform()"><output>{{ currentEquipment.scale }}</output></label>
        </div>
        <button class="reset" type="button" (click)="resetEquipment()">СБРОСИТЬ ВЫБРАННОЕ</button>
      </details>
    </section>
  </main>
</ion-content>
