<ion-content fullscreen class="movement-page">
  <main class="movement-shell">
    <header class="movement-header">
      <button class="back-button" type="button" aria-label="Вернуться к бою" (click)="goBack()">‹</button>
      <div>
        <span>Тренировочный полигон</span>
        <h1>Движение: {{ character().name }}</h1>
      </div>
      <b>{{ character().directionArrow }}{{ characterId() === 'tomato-front' ? '' : ' 3/4' }}</b>
    </header>

    <section
      class="arena"
      [class.character-tomato-diagonal]="characterId() === 'tomato'"
      [class.direction-front-right]="characterId() === 'carrot'"
      [class.direction-front]="characterId() === 'tomato-front'"
      [attr.aria-label]="'Предпросмотр движения ' + character().directionLabel"
    >
      <div class="arena-grid" aria-hidden="true"></div>
      <div class="path" aria-hidden="true">
        <span class="path-arrow">{{ character().directionArrow }}</span>
      </div>

      <div
        class="traveller"
        [class.is-walking]="isWalking()"
        [style.--walk-duration]="durationMs() + 'ms'"
      >
        <img
          [src]="currentFrame()"
          [alt]="character().name + ' идёт ' + character().directionLabel"
          draggable="false"
        />
        <span class="ground-shadow" aria-hidden="true"></span>
      </div>

      <div class="start-marker">СТАРТ</div>
      <div class="finish-marker">ФИНИШ</div>
    </section>

    <section class="controls" aria-label="Управление движением">
      <div class="character-picker" aria-label="Выбор персонажа">
        @for (option of characters; track option.id) {
          <button
            type="button"
            [class.active]="characterId() === option.id"
            [attr.aria-pressed]="characterId() === option.id"
            (click)="selectCharacter(option.id)"
          >{{ option.name }}</button>
        }
      </div>

      <div class="speed-picker">
        <label for="movement-speed">Скорость</label>
        <input
          id="movement-speed"
          type="range"
          min="0.05"
          max="1.5"
          step="0.05"
          [value]="speed()"
          (input)="setSpeedFromInput($event)"
        />
        <output for="movement-speed">{{ speed().toFixed(2) }}×</output>
      </div>

      <div class="speed-picker">
        <label for="stride-length">Длина шага</label>
        <input
          id="stride-length"
          type="range"
          min="0.6"
          max="5"
          step="0.05"
          [value]="strideLength()"
          (input)="setStrideFromInput($event)"
        />
        <output for="stride-length">{{ strideLength().toFixed(2) }}×</output>
      </div>

      <button class="move-button" type="button" (click)="play()">
        <strong>{{ isWalking() ? 'ИДЁТ…' : 'ПОВТОРИТЬ ДВИЖЕНИЕ' }}</strong>
        <small>
          {{ character().frameCount }} кадров ·
          {{ character().directionLabel }}
        </small>
      </button>

      <button class="route-button" type="button" (click)="openRoutePreview()">
        СЛОЖНАЯ ТРАЕКТОРИЯ
      </button>

      <button class="route-button" type="button" (click)="openCirclePreview()">
        ВОСЬМИГРАННАЯ ТРАЕКТОРИЯ
      </button>
    </section>
  </main>
</ion-content>
