<!doctype html>
<html lang="ru" data-sprites="sheet" data-layout="mobile-arena">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pepper Arena · Mobile Battle</title>
<link rel="stylesheet" href="/assets/shared/styles/mobile-battle.css">
<style>.control{font-size:12px}.energy{min-width:0}.cells{min-width:0}</style>
</head>
<body><main class="app">
<header class="top"><section class="hero"><div class="portrait"><img src="/assets/characters/pepper/sprites/front/idle.png"></div><div><div class="name">Пламенный Перец</div><div class="rating">🏆 1850</div><div class="teamhp"><i id="redHp"></i></div></div></section><div class="round"><small>РАУНД 3</small><div class="timer" id="timer">02:00</div></div><section class="hero enemy"><div><div class="name">Алый Страж</div><div class="rating">🏆 1823</div><div class="teamhp"><i id="blueHp"></i></div></div><div class="portrait"><img src="/assets/characters/pepper/sprites/front/cast.png"></div></section></header>
<a class="back" href="/catalog" target="_top">← Все поединки</a><section class="arena" id="arena"><div class="garden"></div><canvas id="cv"></canvas><div class="battle-result" id="battleResult" role="status" aria-live="polite" hidden><strong id="battleResultText"></strong><span id="battleResultDetail"></span><small>Нажмите «Новый бой», чтобы повторить</small></div><div class="position-hint" id="positionHint">Расстановка: перетащите бойца или выберите его и укажите место</div></section>
<footer class="bottom"><div class="actions"><div class="energy"><span class="bolt">⚡</span><span id="energyText">5/10</span><span class="cells" id="cells"></span></div><button class="control" id="auto">Начать бой</button><button class="control" id="restartBattle" aria-label="Начать заново" title="Начать заново">↻</button><button class="control" id="speed">×1 ▶</button></div><div class="skills"><button class="skill" data-cost="2" data-kind="volley"><span class="cost">2</span><img src="/assets/characters/pepper/sprites/front/cast.png"><strong>Огненный залп</strong></button><button class="skill" data-cost="4" data-kind="blast"><span class="cost">4</span><img src="/assets/characters/pepper/sprites/front/idle.png"><strong>Перечный взрыв</strong></button><button class="skill" data-cost="3" data-kind="rush"><span class="cost">3</span><img src="/assets/characters/pepper/sprites/front/walk-a.png"><strong>Алый рывок</strong></button><button class="skill" data-cost="4" data-kind="heal"><span class="cost">4</span><img src="/assets/characters/pepper/sprites/back/cast.png"><strong>Листовое лечение</strong></button></div></footer>
<details class="motion-settings"><summary>⚙ Механика боя</summary><div class="controls"><p>Правила контакта — из боя с фигурами. Дальность измеряется между границами бойцов, не между центрами.</p><label>Дальность всех бойцов <output id="rangeValue">100%</output><input id="attackRange" aria-label="Множитель дальности" type="range" min="50" max="200" step="5" value="100"></label><label>Скорость всех бойцов <output id="speedValue">100%</output><input id="moveSpeed" aria-label="Множитель скорости" type="range" min="50" max="200" step="5" value="100"></label><div id="fighterStats"></div><button id="restartMotion">Новый бой и расстановка</button><button id="shuffleTeams">Перемешать команды</button></div></details>
</main><script src="/assets/shared/runtime/figure-physics.js"></script><script src="/assets/shared/runtime/sheet-sprites.js"></script><script src="/assets/shared/runtime/combat-mix.js"></script><script src="/assets/shared/runtime/mobile-battle.js"></script></body></html>
