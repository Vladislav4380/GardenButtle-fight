<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Звуки боя</title>
<style>
body{margin:0;padding:16px;background:#0b1710;color:#edf7ec;font:16px/1.4 system-ui}
h1{margin:0 0 4px;font-size:22px}p{margin:0 0 14px;color:#cfe3c4}
h2{margin:18px 0 8px;font-size:17px;color:#ffd56b}
.mode a{color:#9bd96b;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
button{min-height:52px;padding:6px 10px;border:1px solid #395e45;border-radius:12px;background:#16301f;color:#edf7ec;font:600 15px system-ui;text-align:left;cursor:pointer}
button small{display:block;color:#9fb3a3;font-weight:500;font-size:13px}
</style>
</head>
<body>
<h1>Звуки боя</h1>
<p>Нажимайте кнопки и слушайте. Напишите номера звуков, которые не нравятся.</p>
<p class="mode"><a href="?">Звуки этого компьютера (если есть)</a> · <a href="?sfx=site">Звуки сайта</a></p>
<div id="list"></div>
<script src="/assets/shared/runtime/battle-sfx.js"></script>
<script>
// Every cue of battle-sfx.js on its own button, to judge them one by one.
const GROUPS = [
  ["Удары", [
    ["hit", { kind: "blunt" }, "кабачок, картофель, орех, огурец"],
    ["hit", { kind: "slash" }, "свёкла, персик"],
    ["hit", { kind: "thrust" }, "морковь"],
    ["hit", { kind: "arrow" }, "стрела лука"],
    ["hit", { kind: "kernel" }, "зерно кукурузы"],
    ["hit", { kind: "juice" }, "помидор"],
    ["hit", { kind: "fire" }, "огонь перца"],
    ["hit", { kind: "magic" }, "магия баклажана"],
    ["hit", { kind: "blunt", big: true }, "сильный удар (умение)"],
  ]],
  ["Выстрелы", [
    ["shoot", { kind: "arrow" }, "лук"],
    ["shoot", { kind: "kernel" }, "кукуруза"],
    ["shoot", { kind: "juice" }, "помидор"],
    ["shoot", { kind: "fire" }, "перец"],
    ["shoot", { kind: "magic" }, "баклажан"],
  ]],
  ["Движение", [
    ["step", {}, "шаг (звучит не каждый)"],
    ["dash", {}, "рывок"],
    ["leap", {}, "прыжок моркови"],
  ]],
  ["События", [
    ["cast", {}, "умение"],
    ["death", {}, "падение героя"],
    ["end", {}, "конец раунда"],
    ["win", {}, "победа"],
    ["loss", {}, "поражение"],
    ["draw", {}, "ничья"],
  ]],
];
let n = 0;
document.getElementById("list").innerHTML = GROUPS.map(([title, cues]) =>
  `<h2>${title}</h2><div class="grid">${cues.map(([name, opts, label]) =>
    `<button data-cue='${JSON.stringify([name, opts])}'>${++n}. ${label}<small>${name}${opts.kind ? " · " + opts.kind : ""}</small></button>`).join("")}</div>`).join("");
document.querySelectorAll("button").forEach((b) => (b.onclick = () => {
  const [name, opts] = JSON.parse(b.dataset.cue);
  // The first tap starts the audio and loads the samples: give them a moment before the first cue.
  setTimeout(() => BattleSfx.play(name, opts), 150);
}));
</script>
</body>
</html>
