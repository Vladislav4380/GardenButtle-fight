<title>Огород</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#0b1710;color:#f5f2df;font-family:Inter,system-ui,sans-serif;-webkit-text-size-adjust:100%;text-size-adjust:100%}

.bottom{justify-content:space-around;background:none;pointer-events:none}.bottom .big{pointer-events:auto}

.glory{font-size:15px}.hero-card{display:flex;gap:12px;align-items:center;padding:10px;border-radius:14px;background:#0000004d;box-shadow:inset 0 0 0 1px #8a6a2a66;font-size:14px;line-height:1.45}.hc-home{font-size:56px}

.seed.none{opacity:.4}.item .emo{font-size:46px;font-style:normal;line-height:62px}.tip .stop{color:#ff8a7a;font-style:normal}.wet{margin:6px 0 0;color:#9fd8ff;font:700 13px system-ui;text-align:center}.seed.sickle{width:76px}.seed.sickle .face{width:60px;height:60px}
.tip{display:flex;align-items:center;gap:8px;text-align:left!important;font-size:15px!important;color:#edf7ec!important}.tip .face{width:44px;height:46px;object-fit:contain}

.brow{flex-wrap:wrap}.brow .what{min-width:140px}.basket{position:relative;display:block;height:18px;margin-top:4px;border-radius:9px;background:#0b1710;box-shadow:inset 0 0 0 1px #8a6a2a88;overflow:hidden;font-style:normal}.basket>i{position:absolute;inset:0 auto 0 0;background:linear-gradient(#9bd96b,#4f9a2a)}.basket em{position:relative;display:block;text-align:center;font:800 12px/18px system-ui;font-style:normal;color:#fff}

.army{cursor:pointer}

.seedsline{display:flex;flex-wrap:wrap;gap:4px}.seedsline img.face{width:44px;height:46px;object-fit:contain}

.board{display:grid;grid-template-columns:1fr 1fr;gap:12px 10px;padding:16px 12px;border-radius:14px;border:3px solid #b07a3a;box-shadow:inset 0 0 0 2px #3b1f0c,inset 0 0 0 4px #e0b06a55,0 4px 10px #0008;background:repeating-linear-gradient(90deg,#00000014 0 2px,transparent 2px 46px),linear-gradient(#8a5a2e,#6b4220 50%,#5a3518)}
.note{position:relative;display:flex;flex-direction:column;gap:2px;padding:16px 10px 10px;border-radius:3px;background:linear-gradient(#f6e7c4,#e8d3a4);color:#3a2410;box-shadow:0 3px 6px #0007;transform:rotate(var(--tilt))}

.note .want b{display:block;font:900 17px system-ui;white-space:nowrap}.note .want small{display:block;font:700 12px system-ui;color:#7a5a30}
.note .pay{display:flex;align-items:center;gap:4px;margin:4px 0 6px;font:900 18px system-ui;color:#7a4a00}.note .pay img{width:22px;height:22px}
.note .buy{min-width:0;width:100%;height:38px;font-size:14px}
.note.done>*:not(.stamp):not(.pin){opacity:.45}
.note .stamp{position:absolute;left:50%;top:52%;padding:2px 8px;border:3px solid #b3261e;border-radius:6px;color:#b3261e;font:900 17px system-ui;text-transform:uppercase;letter-spacing:1px;transform:translate(-50%,-50%) rotate(-14deg);background:#f6e7c4cc}
.otime{margin:10px 0 0;text-align:center;font:700 14px system-ui;color:#c3d4c6}.otime b{color:#ffd56b}
.btabs{position:sticky;top:-16px;z-index:2;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0 -16px 6px;padding:8px 16px;background:#132619}.btabs button{flex:1;min-width:0;height:38px;padding:0 4px;border-radius:12px;border:1px solid #8a6a2a;background:#3a2a10;color:#ffd56b;font:800 13px system-ui;white-space:nowrap}.btabs button.on{background:linear-gradient(#ffe794,#f0a531);color:#2a1a05;border-color:#b07a1a}
.card h4{margin:14px 0 4px;font-size:15px;color:#ffd56b;text-transform:uppercase;letter-spacing:.04em}.del{color:#ffb0b0!important;border-color:#7a3a3a!important;background:#3a1717!important}
/* Placing a bed: confirm or cancel. */
.place{position:absolute;left:0;right:0;bottom:0;z-index:3;display:flex;gap:10px;padding:10px 12px max(12px,0px);background:#0b1710e6}.place[hidden]{display:none}
.place button{flex:1;height:54px;border:0;border-radius:14px;font:800 15px system-ui;line-height:1.15;padding:0 8px}.place .ok{flex:1.4}.ok{color:#2a1600;background:linear-gradient(#ffd56b,#f0a531)}.ok:disabled{opacity:.45}.no{color:#edf7ec;background:#1d3a26;border:1px solid #5a7a62!important}
/* A panel from the bottom: the shop, the barn, a bed. */
.sheet{position:absolute;inset:0;z-index:5;display:flex;align-items:flex-end;justify-content:center;background:#000a}.sheet[hidden]{display:none}
.card{width:min(560px,100%);max-height:88%;overflow-y:auto;overscroll-behavior:contain;padding:16px 16px 0;border-radius:20px 20px 0 0;background:#132619;font-size:16px;line-height:1.4}

.row{display:flex;align-items:center;gap:10px;padding:8px;margin:6px 0;border-radius:14px;background:#1a3322}

.row .n{font:900 22px system-ui;color:#ffd56b;min-width:36px;text-align:right}
.buy{flex:none;min-width:86px;height:44px;padding:0 10px;border:0;border-radius:12px;font:800 15px system-ui;color:#2a1600;background:linear-gradient(#ffd56b,#f0a531)}.buy:disabled{opacity:.4}
.buy img{width:20px;height:20px;vertical-align:-4px}
.hero{display:flex;gap:12px;align-items:center}.hero img{width:110px;height:116px;object-fit:contain}.hero h3{margin:0}.hero p{margin:2px 0;color:#c3d4c6}
.big-n{font:900 30px system-ui;color:#ffd56b}
.foot{position:sticky;bottom:0;display:flex;flex-direction:column;gap:8px;margin:12px -16px 0;padding:10px 16px max(14px,0px);background:linear-gradient(#13261900,#132619 22%)}
.foot button{height:50px;border-radius:13px;font:800 17px system-ui}.act{border:0;color:#2a1600;background:linear-gradient(#ffd56b,#f0a531)}.act:disabled{opacity:.45}
.back{border:1px solid #5a7a62;background:#1d3a26;color:#edf7ec}.del{border:1px solid #7a3a3a;background:#3a1717;color:#ffb0b0}

.lvl i{display:block;width:70px;height:10px;border-radius:5px;background:#0006;overflow:hidden}.lvl i span{display:block;height:100%;width:0;background:linear-gradient(90deg,#9bd96b,#d8f59a);transition:width .4s}
/* Under the top bar: the army and the tasks. */
.side{position:absolute;left:10px;top:calc(max(8px,0px) + 50px);z-index:2;display:flex;flex-direction:column;gap:6px;max-width:220px;pointer-events:none}.side>*{pointer-events:auto}
.army{display:flex;align-items:center;gap:8px;padding:4px 4px 4px 10px;border-radius:16px;background:#0b1710d9;font:800 13px system-ui;color:#edf7ec}
.fight{padding:5px 10px;border-radius:12px;background:#3a2a10;color:#ffd56b;font:800 13px system-ui;text-decoration:none;border:1px solid #8a6a2a}.fight.ready{background:linear-gradient(#ffd56b,#f0a531);color:#2a1600;animation:pulse 1.2s infinite}

.qbtn{align-self:flex-start;height:32px;padding:0 12px;border-radius:16px;border:1px solid #395e45;background:#0b1710d9;color:#edf7ec;font:800 13px system-ui}.qbtn b{color:#ffd56b}.qbtn.ready{background:#2f5a1c;border-color:#9bd96b;animation:pulse 1.2s infinite}
.quests li{display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:12px;background:#0b1710cc;font:700 12px system-ui;color:#dfe9d6}.quests li img{width:24px;height:24px;object-fit:contain}.quests li small{color:#ffd56b;margin-left:auto;white-space:nowrap}
.quests li.done{background:#2f5a1ccc;cursor:pointer}.quests li.done small{color:#fff}
@keyframes pulse{50%{transform:scale(1.08)}}
/* ---- The layout: a panel at the top, the field, a panel at the bottom. The panels are dark wood with a bronze rim,
   like the battle screen's. ---- */
.app{display:flex;flex-direction:column}
.hud,.dock{position:relative;z-index:3;flex:none;background:linear-gradient(#2b2013,#1a130b);box-shadow:0 0 0 1px #00000080,inset 0 1px 0 #ffffff14}
.hud{padding:max(6px,0px) 10px 6px;border-bottom:3px solid #8a6a2a;display:flex;flex-direction:column;gap:6px}
.dock{border-top:3px solid #8a6a2a;padding:6px 10px max(8px,0px)}
.hud-row{display:flex;align-items:center;gap:6px;white-space:nowrap}.hud-row>*{flex:none}.hud-row .sp{flex:1}
.stage{position:relative;flex:1;min-height:0;overflow:hidden}
.stage canvas{position:absolute;inset:0;width:100%;height:100%}
/* Inside the panels the pieces sit on the wood: no floating dark pills. */
.hud .gold,.hud .lvl,.hud .army{background:#0000004d;box-shadow:inset 0 0 0 1px #8a6a2a66}
.hud .gold{height:38px}.hud .lvl{height:38px}.hud .lvl b{width:30px;height:30px}
.hud .army{padding:6px 10px;border-radius:14px}
.hud .pill{background:#0000004d;border-color:#8a6a2a88}
.dock .bottom{position:static;padding:0;justify-content:space-around;pointer-events:auto}
.dock .big{background:#0000004d;box-shadow:inset 0 0 0 1px #8a6a2a66;width:25%;max-width:120px;padding:4px 0 6px}
.ferts{display:flex;flex-direction:column;justify-content:center;gap:6px;touch-action:none}.ferts button{display:flex;align-items:center;gap:2px;height:36px;padding:0 8px;border-radius:12px;border:0;background:#0000004d;box-shadow:inset 0 0 0 1px #8a6a2a66;color:#ffd56b;font:900 20px system-ui;touch-action:none;user-select:none;-webkit-user-select:none}.ferts b{font-size:14px}.ferts button.none{opacity:.55}
.fghost{position:fixed;z-index:20;font-size:44px;line-height:1;transform:translate(-50%,-90%);pointer-events:none;filter:drop-shadow(0 4px 6px #000a)}.fghost[hidden]{display:none}.dock .big img{width:50px;height:50px}
.dock .place{position:static;padding:0;background:none}
/* The tasks open over the top of the field, under the panel. */
.stage .quests{position:absolute;top:8px;right:8px;z-index:4;max-width:min(320px,calc(100% - 16px))}
.stage .hint{top:10px;max-width:calc(100% - 96px)}

.drawer{position:absolute;top:0;bottom:0;right:0;z-index:4;width:132px;transform:translateX(100%);transition:transform .25s ease;background:linear-gradient(90deg,#2b2013f2,#1a130bf2);border-left:3px solid #8a6a2a;box-shadow:-6px 0 14px #0007}
.drawer.open{transform:none}
.drawer-tab{position:absolute;left:-46px;top:12px;width:46px;height:52px;border:3px solid #8a6a2a;border-right:0;border-radius:14px 0 0 14px;background:#2b2013;color:#ffd56b;font-size:24px;box-shadow:-4px 2px 10px #0007}
.drawer-list{height:100%;overflow-y:auto;overscroll-behavior:contain;padding:8px 8px 20px;display:flex;flex-direction:column;gap:6px}
.drawer-list h5{margin:8px 2px 0;font:800 11px system-ui;color:#ffd56b;text-transform:uppercase;letter-spacing:.05em}
.item{position:relative;display:flex;flex-direction:column;align-items:center;padding:6px 4px 4px;border-radius:12px;background:#0000004d;box-shadow:inset 0 0 0 1px #8a6a2a66;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.item img{width:96px;height:62px;object-fit:contain;pointer-events:none}.item span{font:700 11px system-ui;color:#edf7ec;text-align:center;line-height:1.15}
.item b{position:absolute;top:3px;right:5px;font:900 12px system-ui;color:#ffd56b;text-shadow:0 1px 2px #000}.item.poor{opacity:.45}
.big.pulse{animation:pulse .35s 2}

.home{display:none}

/* Upright the second row holds the army, the battle, the glory and the tasks: compact enough for 375px. */
.hud-row{gap:5px}.hud .army{padding:5px 8px;font-size:12px}.fight{padding:5px 8px;font-size:12px}.gchip{padding:0 8px;font-size:12px;min-width:0;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto!important}.qbtn{padding:0 9px}
/* ---- A phone held sideways: the panels become narrow columns at the left and the right, the field takes the whole
   height between them (nothing of the interface ever lies over the field); windows fit the height and scroll inside. */
@media (orientation: landscape) and (max-height: 760px) {
  .app{flex-direction:row}
  .hud{order:0;width:172px;height:100%;overflow-y:auto;border-bottom:0;border-right:3px solid #8a6a2a;padding:6px 8px;gap:6px;justify-content:flex-start}

  .hud .gold{font-size:17px;gap:4px}.hud .gold img{width:28px;height:28px}.hud .gchip{white-space:normal;height:auto;min-height:30px;padding:4px 8px;line-height:1.15}.hud .army{font-size:13px}
  .hud-row{flex-direction:column;align-items:stretch;gap:6px;white-space:normal}.hud-row .sp{display:none}
  .hud .gold,.hud .lvl{height:34px;justify-content:flex-start}.hud .lvl i{width:auto;flex:1}

  .hud .hud-row:first-of-type{display:grid;grid-template-columns:1fr 1fr;gap:6px}.hud .hud-row:first-of-type .gold,.hud .hud-row:first-of-type .lvl{grid-column:1/3}

  .dock .bottom{flex-direction:column;align-items:stretch;justify-content:space-around;gap:6px;height:100%}

  .card{width:min(640px,92%);max-height:96%;border-radius:20px}
  .stage .hint{font-size:13px;padding:5px 10px}
}

<body>
<main class="app">
  <!-- The control panel at the top, off the field: gold, level, the army and the way to battle, tasks, test buttons. -->
  <header class="hud">
    <a class="home" href="/main" target="_top" aria-label="Главная"><i>←</i><span> Главная</span></a>
    <div class="hud-row">
      <a class="home up" href="/main" target="_top" aria-label="Главная">←</a>
      <div class="gold"><img src="/assets/garden/icon-gold.png" alt=""><span id="gold">0</span></div>
      <div class="lvl" title="Уровень огорода"><b id="lvlN">1</b><i><span id="xpBar"></span></i></div>
      <span class="sp"></span>
      <button class="pill" id="speed" title="Время для теста">×1</button>
      <button class="pill" id="reset" title="Начать огород заново">↺</button>
    </div>
    <div class="hud-row">
      <div class="army"><span id="army">Армия: 0</span></div>
      <a class="fight" id="fight" href="/duels/tft-6x6?from=garden" target="_top">⚔ В бой</a>
      <button class="gchip" id="gchip">🌾 0</button>
      <span class="sp"></span>
      <button class="qbtn" id="qbtn" aria-label="Задания">📜 <b id="qcount">3</b></button>
    </div>
  </header>
  <!-- The field: everything inside it is the game. -->
  <section class="stage">
    <canvas id="map"></canvas>
    <div class="hint" id="hint"></div>
    <ul class="quests" id="quests" hidden></ul>
    <div class="menu" id="menu" hidden></div>
    <!-- The shop as a drawer at the right edge: drag an object from it onto the field to buy and place it. -->
    <aside class="drawer" id="drawer">
      <button class="drawer-tab" id="drawerTab" aria-label="Постройки">🛠</button>
      <div class="drawer-list" id="drawerList"></div>
    </aside>
  </section>
  <!-- The control panel at the bottom: the buildings; while placing, the confirm and cancel buttons instead. -->
  <footer class="dock">
    <nav class="bottom" id="bottom">
      <div class="ferts" id="ferts">
        <button data-fert="yield" aria-label="Удобрение для урожая">🧪<b>×0</b></button>
        <button data-fert="grow" aria-label="Удобрение для роста">⚡<b>×0</b></button>
      </div>
      <button class="big" id="barnBtn"><img src="/assets/garden/icon-barn.png" alt="">Амбар</button>
      <button class="big" id="shopBtn"><img src="/assets/garden/icon-build.png" alt="">Стройка</button>
      <button class="big" id="bazaarBtn"><img src="/assets/garden/icon-gold.png" alt="">Базар</button>
    </nav>
    <div class="place" id="place" hidden></div>
  </footer>
  <section class="sheet" id="sheet" hidden></section>
</main>
<script>
/* Opened as a Telegram Mini App: take the whole screen and switch off the swipe down that closes the app. */
(function () {
  if (!/tgWebApp/.test(location.hash + location.search)) return;
  var s = document.createElement("script");
  s.src = "https://telegram.org/js/telegram-web-app.js";
  s.onload = function () {
    var app = window.Telegram && Telegram.WebApp;
    if (!app) return;
    app.ready();
    app.expand();
    if (app.disableVerticalSwipes) app.disableVerticalSwipes();
  };
  document.head.appendChild(s);
})();
</script>
<script src="garden.js"></script>
</body>
</html>
