<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Огородная арена · 6×6</title>
<style>
*{box-sizing:border-box}html,body{margin:0;overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%;height:100%;background:#0b1710;color:#f5f2df;font-family:Inter,system-ui,sans-serif;overflow:hidden}
.app{position:relative;display:flex;flex-direction:column;height:var(--visible-h,100dvh);max-width:1400px;margin:auto;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:8px 12px;background:#0b1710e6;z-index:2}
.team{font:800 14px system-ui}.team.enemy{text-align:right}
.bar{height:8px;margin-top:4px;border-radius:4px;background:#0006;overflow:hidden}.bar i{display:block;height:100%;width:100%}
#hp0{background:#62e26f}#hp1{background:#ff5a4a;margin-left:auto}
.timer{font:900 20px system-ui;padding:2px 10px;border-radius:8px;background:#000a}.mid{display:flex;flex-direction:column;align-items:center;gap:2px}.clock{display:flex;align-items:center;gap:4px}.sound{width:36px;height:36px;padding:0;border:0;border-radius:8px;background:#000a;font-size:18px;line-height:1;cursor:pointer}#round{font:800 12px system-ui;color:#ffd56b;white-space:nowrap}
.field{position:relative;flex:1;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
/* The hint: a pill at the top of the field until the first touch. */
.sfxlog{position:absolute;right:6px;top:84px;z-index:5;padding:8px 10px;border-radius:8px;background:#000d;font:14px/1.5 ui-monospace,monospace;color:#ffe9b0;white-space:nowrap;cursor:pointer}.sfxlog b{color:#9bd96b}
.hint{position:absolute;left:50%;top:6px;transform:translateX(-50%);width:max-content;max-width:92%;z-index:4;padding:6px 12px;border-radius:12px;background:#0b1710d9;font-size:14px;color:#e4f0dc;text-align:center;pointer-events:none}.hint[hidden]{display:none}
.traits:not([hidden]){display:flex}.traits{flex-wrap:wrap;align-items:center;gap:3px 12px;padding:5px 10px;background:#122a1c;border-top:1px solid #2b4634;border-bottom:1px solid #2b4634;z-index:2}.traits[hidden]{display:none}.traits>b{font:800 11px system-ui;color:#9fb3a3;text-transform:uppercase;letter-spacing:.05em}.chip{min-height:44px;padding:4px 2px;border:0;background:none;color:#a9bdaf;font:600 14px system-ui;text-align:left;cursor:pointer}.chip b{color:#d8e8d0}.chip.on,.chip.on b{color:#ffd56b}.info{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92%,420px);z-index:5;padding:12px 14px;border-radius:14px;background:#0b1710f2;border:1px solid #9bd96b;font-size:16px;line-height:1.4}.info h3{margin:0 0 6px;font-size:19px}.info p{margin:4px 0}.info p.on{color:#ffe36b}.info .bonus{color:#9bd96b;font-weight:700}.info .close{margin-top:8px;font-size:11px;color:#8fa596;text-align:center}
/* After a battle: the result panel and, under it, the buttons across the whole screen. */
.after{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:16px;padding:0 12px calc(max(12px,env(safe-area-inset-bottom)) + 60px)}.after[hidden],.bottom[hidden]{display:none}
.after .actions{display:flex;width:100%;max-width:520px;flex-direction:column;gap:12px;animation:result-in .45s .35s cubic-bezier(.2,1.3,.4,1) both}
.after .actions button{width:100%;height:62px;font-size:20px}.after #start{order:-1}.after #energy{display:none}
.result{width:min(340px,100%);box-sizing:border-box;padding:18px 22px;border-radius:16px;background:#0b1710ee;border:1px solid #9bd96b;text-align:center}
.result strong{display:block;font-size:28px}
/* End of a round: the field dims slowly, then the result panel rises in and its title pops. */
.field::after{content:"";position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity 1.2s ease}
.field.over::after{opacity:.45}
.result{animation:result-in .55s cubic-bezier(.2,1.3,.4,1) both}
.result strong{animation:result-pop .5s .25s ease-out both}
@keyframes result-in{from{opacity:0;transform:translateY(40px) scale(.8)}to{opacity:1;transform:none}}
@keyframes result-pop{from{opacity:0;transform:scale(1.4)}to{opacity:1;transform:scale(1)}}.result span{font-size:13px;color:#cfe3c4}
/* The buttons stand on the field itself, over its bottom edge (the board keeps clear of them, see controlsHeight),
   kept to the left and raised over the free host's banner, which sits in the bottom right corner (about 60 px). Styled as game buttons: a gold one for
   the battle and a wooden one for the squad, both raised and pressed down when tapped. */
.bottom{position:absolute;left:0;right:0;bottom:0;z-index:4;display:flex;flex-direction:column;padding:6px 12px calc(max(12px,env(safe-area-inset-bottom)) + 60px) max(12px,env(safe-area-inset-left));pointer-events:none}
.actions{display:flex;gap:10px;align-items:center}
.actions button{pointer-events:auto;white-space:nowrap;height:58px;min-width:58px;padding:0 20px;border:3px solid #6b3f08;border-radius:16px;font:900 18px system-ui;letter-spacing:.01em;color:#3a1d00;text-shadow:0 1px 0 #fff7;background:linear-gradient(#ffe794,#f6b638 55%,#d98a12);box-shadow:inset 0 2px 0 #fff8,0 4px 0 #5a3407,0 8px 16px #000a;cursor:pointer;transition:transform .06s,box-shadow .06s}
.actions button:active{transform:translateY(3px);box-shadow:inset 0 2px 0 #fff8,0 1px 0 #5a3407,0 4px 10px #000a}
.actions button:disabled{filter:grayscale(.5) brightness(.8)}
.actions .ghost{color:#ffeccb;text-shadow:0 1px 0 #000a;border-color:#2e1a08;background:linear-gradient(#9b6b3c,#6e4524 60%,#55341a);box-shadow:inset 0 2px 0 #ffffff30,0 4px 0 #2e1a08,0 8px 16px #000a}
/* The buttons keep to the left: the free host shows its banner in the bottom right corner. */
#energy{order:1;margin-left:auto;font:800 13px system-ui;color:#9fe3ff}
.slots{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.slot{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;padding:4px 1px;border-radius:10px;border:1px solid #395e45;background:#16301f;color:#edf7ec;font:700 12px system-ui}.slot>span:not(.tags){max-width:100%;letter-spacing:-.03em;white-space:nowrap;overflow:hidden}
.slot{position:relative}.slot .tags{order:3;display:flex;justify-content:center;gap:3px;line-height:0}
/* Drawn group badges: default size next to text, larger on the hero buttons and in the cards. */
.ti{width:1.6em;height:1.6em;vertical-align:-.45em;flex:none;object-fit:contain}.slot .tags .ti{width:26px;height:26px}
.hero-card .tags .ti{width:36px;height:36px;vertical-align:-12px;margin-right:4px}.pick-traits .ti{width:32px;height:32px;vertical-align:-10px;margin-right:2px}
.info .ti{width:30px;height:30px;vertical-align:-9px}.info h3 .ti{width:40px;height:40px;vertical-align:-12px}.slot .tags i{font-style:normal}.slot img{height:64px;max-width:100%;object-fit:contain}.slot .copy{font:700 12px system-ui;color:#ffb35a;line-height:1.1}.slot .thumb{display:block;width:34px;height:34px;background-repeat:no-repeat;background-position:0 0}.slot:disabled{opacity:.6}
.back{position:absolute;top:52px;left:10px;z-index:3;color:#d5e9ca;font-size:13px;text-decoration:none;background:#0b1710b3;padding:3px 8px;border-radius:8px}
/* Squad picker: a full screen over the board, large type. */
.picker{position:absolute;inset:0;z-index:20;overflow:auto;padding:14px;background:#0b1710}
.picker h2{margin:0 0 6px;font-size:24px}.picker .goal{margin:0 0 12px;font-size:17px;line-height:1.45;color:#dcebd4}
/* The chosen squad stays pinned at the top while the hero list scrolls under it. */
.pick-squad{position:sticky;top:-14px;z-index:5;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin:0 -14px 10px;padding:8px 14px;background:#0b1710;box-shadow:0 8px 12px -6px #000c}
.pick-slot{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;min-height:96px;padding:4px;overflow:hidden;border-radius:12px;border:1px solid #395e45;background:#16301f;color:#edf7ec;font:700 14px system-ui;cursor:pointer}
.pick-slot img{height:56px;max-width:100%;object-fit:contain}.pick-slot .groups{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:2px 3px;font-style:normal;line-height:1.1}.pick-slot .groups .ti{width:24px;height:24px}.pick-slot .groups small{flex-basis:100%;font:600 13px system-ui;color:#ffe9b0;white-space:nowrap}.pick-slot span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pick-slot .x{position:absolute;top:2px;right:4px;font-size:14px;color:#c7a0a0}.pick-slot em{font:700 10px system-ui;color:#ffb35a;font-style:normal}
.pick-slot.repeat{border-style:dashed;border-color:#7a5a2a}.pick-slot.repeat .groups small{color:#e0a060}.pick-slot.locked{opacity:.55;cursor:default}.pick-slot.empty{justify-content:center;border-style:dashed;color:#6f8a77}
.pick-traits{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:4px 14px;margin-bottom:12px;font-size:17px;color:#c3d4c6}.pick-traits .on,.pick-traits .on b{color:#ffd56b}.pick-traits small{color:#b5c8b9;font-size:15px}
.pick-heroes{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}
.hero-card{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:14px;border:1px solid #395e45;background:#132619;color:#edf7ec;text-align:left;font-size:16px;line-height:1.4;cursor:pointer}
.hero-card.in{border-color:#9bd96b}.hero-card img{width:84px;height:110px;object-fit:contain;flex:none}
.hero-card h4{margin:0 0 2px;font-size:22px}.hero-card h4 span{font-size:13px;color:#9fb3a3;font-weight:600}.hero-card p{margin:3px 0}.hero-card .tags{color:#ffe9b0}
/* Group badges lit when the squad has that bonus on; the count of the squad in the group next to its name. */
.tb{display:inline-block;border-radius:50%;line-height:0}.tb.on{box-shadow:0 0 0 2px #ffd56b,0 0 12px 2px #ffd56b99}.tb:not(.on){filter:saturate(.55) brightness(.85)}
.cnt{display:inline-block;padding:1px 7px;border-radius:9px;background:#0006;color:#b5c8b9;font-size:.85em;font-weight:800;white-space:nowrap}.cnt.on{background:#ffd56b;color:#2a1600}.cnt.next{background:#2f5a2a;color:#c8f0a0}.hero-card .kind{color:#b5c8b9;font-weight:600}.hero-card .add{color:#9bd96b;font-weight:700}
.pick-go{position:sticky;bottom:0;padding:10px 0 2px;background:linear-gradient(#0b171000,#0b1710 40%)}
.pick-go button{width:100%;height:46px;border:0;border-radius:12px;font:800 16px system-ui;color:#2a1600;background:linear-gradient(#ffd56b,#f0a531)}.pick-go button:disabled{opacity:.5}
/* A narrow phone: the squad in two rows of three, smaller type. */
.chip .short{display:none}
/* A phone: the synergy strip turns into a compact grid, details on tap, so the board keeps its height. */
@media (max-width:600px){.traits:not([hidden]){display:grid}.traits{grid-template-columns:repeat(3,1fr);gap:0 6px;padding:2px 8px}.traits>b{display:none}.chip{min-height:44px;font-size:13px;line-height:1.15}.chip .ti{width:24px;height:24px}.chip .long{display:none}.chip .short{display:inline}}
@media (max-width:420px){.pick-squad{grid-template-columns:repeat(3,minmax(0,1fr))}.picker h2{font-size:21px}}
/* The squad picker on any phone, upright or sideways: large type to read without zooming, clear of the notch. */
@media (max-width:600px),(orientation:landscape) and (max-height:540px){
.picker{padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 0 max(12px,env(safe-area-inset-left))}
.pick-squad{top:calc(-1 * max(10px,env(safe-area-inset-top)));margin-left:-12px;margin-right:-12px;padding-left:12px;padding-right:12px}.pick-slot{min-height:0}.pick-slot img{height:44px}
.picker .goal{font-size:17px}
.pick-traits{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));font-size:17px}.pick-traits small{font-size:16px}
.pick-heroes{grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:10px}
.hero-card{font-size:17px;line-height:1.45;padding:12px}.hero-card h4{font-size:23px}.hero-card h4 span{font-size:15px}.hero-card img{width:96px;height:124px}
.pick-slot{font-size:15px}
.pick-go{padding-bottom:max(6px,env(safe-area-inset-bottom))}.pick-go button{height:50px;font-size:18px}
}
/* A phone turned sideways: the board keeps the whole height, the controls stand in a narrow column on the left
   (the free host shows its banner in the bottom right corner):
   the main button on top, the small ones under it. */
@media (orientation:landscape) and (max-height:540px){
.app{display:grid;grid-template-columns:128px 1fr;grid-template-rows:auto 1fr;max-width:none}
.top{grid-column:1/3;padding:2px 10px}.top .bar{margin-top:2px}.timer{font-size:16px}
.field{grid-column:2;grid-row:2}
.bottom{position:static;pointer-events:auto;background:#0b1710e6;grid-column:1;grid-row:2;justify-content:center;gap:0;padding:8px 4px max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
.hint{display:none}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions #energy{display:none}
.actions #start{grid-column:1/3;order:-1;height:64px;font-size:16px;line-height:1.1;white-space:normal}
.actions #team{grid-column:1/3}
.actions button{height:52px;padding:0 6px;font-size:15px;line-height:1.1;white-space:normal}
/* The squad picker sideways: the button is a compact pill in the bottom left corner, not a bar across the screen. */
.pick-go{display:flex;justify-content:flex-start;padding:8px 0 max(8px,env(safe-area-inset-bottom));background:none;pointer-events:none}
.pick-go button{width:auto;height:46px;padding:0 28px;font-size:17px;pointer-events:auto;box-shadow:0 4px 16px #000a}
}
</style>
<script>/* The height the browser really shows: Safari's tab bar and toolbars change it when the phone turns. */(function(){function f(){var v=window.visualViewport;document.documentElement.style.setProperty("--visible-h",Math.round(v?v.height:innerHeight)+"px")}f();addEventListener("resize",f);addEventListener("orientationchange",function(){setTimeout(f,300)});if(window.visualViewport)visualViewport.addEventListener("resize",f)})()</script></head>
<body><main class="app">
<header class="top">
<div class="team">Ваш отряд<div class="bar"><i id="hp0"></i></div></div>
<div class="mid"><div class="clock"><div class="timer" id="timer">01:00</div><button class="sound" id="sound" aria-label="Выключить звук">🔊</button></div><small id="round"></small></div>
<div class="team enemy">Соперник<div class="bar"><i id="hp1"></i></div></div>
</header>
<section class="field">
<canvas id="cv" role="img" aria-label="Игровое поле: ваш отряд внизу, соперник вверху"></canvas>
<div class="info" id="info" hidden></div>
<div class="after" id="after" hidden><div class="result" id="result"><strong id="resultText"></strong><span id="resultDetail"></span></div></div>
<div class="hint" id="hint">Тяните бойцов по клеткам своей половины · нажмите на героя — его умение</div>
</section>
<footer class="bottom">
<div class="actions"><span id="energy"></span><button class="ghost" id="team">Изменить отряд</button><button id="start">Начать бой</button></div>
</footer>
<section class="picker" id="picker" hidden></section>
</main>
<script src="/assets/shared/runtime/sheet-sprites.js"></script>
<script src="/assets/shared/runtime/combat-mix.js"></script>
<script>
/* Opened as a Telegram Mini App (Telegram adds tgWebApp… to the address): load Telegram's script, take the whole
   screen and switch off the swipe down that closes the app, so dragging a hero down does not close the game. */
(function () {
  if (!/tgWebApp/.test(location.hash + location.search)) return;
  var s = document.createElement("script");
  s.src = "https://telegram.org/js/telegram-web-app.js";
  s.onload = function () {
    var app = window.Telegram && Telegram.WebApp;
    if (!app) return;
    app.ready();
    app.expand();
    if (app.disableVerticalSwipes) app.disableVerticalSwipes();
  };
  document.head.appendChild(s);
})();
</script>
<script src="/assets/shared/runtime/battle-sfx.js"></script>
<script src="/assets/shared/runtime/tft-battle.js"></script>
</body></html>
