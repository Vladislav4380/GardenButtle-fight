<!doctype html>
<html lang="ru" data-layout="mobile-horizontal">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Бой за сокровище</title>
<link rel="stylesheet" href="/assets/shared/styles/mobile-battle.css">
<style>.scene-nav{position:absolute;z-index:10;bottom:8px;left:10px;right:10px;display:flex;justify-content:center;gap:16px;font-size:10px}.scene-nav a{color:#d5e9ca;text-decoration:none}
body{padding:0}.app{width:100vw;height:100dvh;min-height:300px;max-width:1200px;border-radius:0;background-position:center 65%}.top{height:76px;border-radius:0;grid-template-columns:minmax(0,1fr) 92px minmax(0,1fr);padding:8px 14px}.hero{grid-template-columns:46px minmax(0,1fr)}.hero.enemy{grid-template-columns:minmax(0,1fr) 46px}.portrait{width:46px;height:46px}.name{font-size:13px}.rating{font-size:16px}.round{padding:4px}.timer{font-size:24px}.arena{inset:65px 0 116px}.bottom{height:116px;border-radius:0;padding:6px 12px 18px;display:grid;grid-template-columns:minmax(240px,.8fr) minmax(300px,1fr);gap:14px;align-items:center}.actions{grid-template-columns:1fr 98px 56px;gap:5px;height:auto}.control{font-size:12px}.energy{padding:5px;font-size:12px}.bolt{font-size:20px}.cells{gap:2px}.skills{margin:0;gap:6px}.skill{height:83px}.skill img{height:48px;width:48px}.skill strong{font-size:8px;bottom:5px}.cost{height:18px;min-width:18px;font-size:10px}.back{top:78px;font-size:9px}.motion-settings{top:78px}.motion-settings .controls{width:190px;gap:5px;padding:7px}.scene-nav{bottom:3px}
@media(orientation:portrait){.app{min-height:640px}.arena{inset:90px 0 218px}.bottom{height:220px;display:block}.actions{height:50px}.skills{margin-top:8px}.skill{height:112px}}
@media(orientation:landscape){.top{height:58px;padding:5px 12px}.portrait{height:38px;width:38px}.hero{grid-template-columns:38px minmax(0,1fr)}.hero.enemy{grid-template-columns:minmax(0,1fr) 38px}.round small{font-size:8px}.timer{font-size:21px}.round{border-radius:0 0 12px 12px;padding:2px}.arena{inset:54px 0 76px}.bottom{height:76px;padding:5px 9px 16px;gap:10px;grid-template-columns:minmax(260px,.85fr) minmax(260px,1fr)}.actions{grid-template-columns:1fr 73px 34px 43px;gap:4px}.control,.energy{height:35px;min-height:35px}.skill{height:52px}.skill img{height:33px;width:33px;transform:translateY(-4px)}.skill strong{font-size:7px;bottom:2px}.cost{right:1px;top:1px;min-width:16px;height:16px;font-size:9px}.back,.motion-settings{top:64px}.scene-nav{font-size:9px;bottom:2px}}
.control{font-size:10px}.energy{min-width:0}.cells{min-width:0}
#stepBar{display:flex;gap:4px;height:42px;align-items:center;min-width:0}#stepBar button{height:36px;min-width:30px;padding:0 6px;border-radius:9px;border:1px solid #936c15;background:#1a140a;color:#ffe9b0;font:800 11px system-ui}#stepBar button.on{background:linear-gradient(#ffc83b,#c87b06);color:#241300}#stepBar .step,#stepBar .rule{font:800 11px system-ui;color:#ffe9b0;white-space:nowrap}#stepBar .rule{margin-left:auto}.position-hint{font-size:11px;background:#06100acc;border-radius:8px;padding:4px 8px;left:50%;right:auto;transform:translateX(-50%);width:min(560px,calc(100% - 16px))}.position-hint b{color:#ffe294}.position-hint.warn b{color:#ff9a7a}.skill.ready{box-shadow:inset 0 0 0 2px #4fe1ff,0 0 10px #26cfff88}.skill.role-defense{box-shadow:inset 0 -3px 0 #48aaff}.skill.role-support{box-shadow:inset 0 -3px 0 #5fd068}.skill.role-attack{box-shadow:inset 0 -3px 0 #ff6a4a}.battle-summary{display:grid;gap:3px;font-size:12px;color:#eef3e6;pointer-events:none;max-width:360px}.battle-result{background:radial-gradient(ellipse at center,#041009f2 0,#041009cc 55%,#04100955 85%)}@media(orientation:portrait){.position-hint{top:6px;bottom:auto}}
.battle-rematch{pointer-events:auto;margin-top:4px;padding:8px 22px;border:0;border-radius:10px;font:800 15px system-ui;color:#2a1600;background:linear-gradient(#ffd56b,#f0a531);box-shadow:0 3px 0 #9c5d10}</style>
</head>
<body><main class="app">
<header class="top"><section class="hero"><div class="portrait"><img src="/assets/characters/tomato/sprites/front/idle.png" alt=""></div><div><div class="name">Ваш отряд</div><div class="rating">⚑ Сундук</div><div class="teamhp"><i id="redHp"></i></div></div></section><div class="round"><small>ЗА СОКРОВИЩЕ</small><div class="timer" id="timer">00:00</div></div><section class="hero enemy"><div><div class="name">Соперник</div><div class="rating">⚑ Сундук</div><div class="teamhp"><i id="blueHp"></i></div></div><div class="portrait"><img src="/assets/characters/tomato/sprites/front/idle.png" alt=""></div></section></header>
<a class="back" href="/" target="_top">← Все поединки</a><section class="arena" id="arena"><div class="garden"></div><canvas id="cv"></canvas><div class="battle-result" id="battleResult" role="status" aria-live="polite" hidden><strong id="battleResultText"></strong><span id="battleResultDetail"></span><small>«Реванш» — тот же соперник. «Новый бой» — другой соперник.</small></div><div class="position-hint" id="positionHint"></div></section>
<footer class="bottom"><div class="actions"><div id="stepBar"></div><div class="energy" id="energyBox"><span class="bolt">⚡</span><span id="energyText">2/10</span><span class="cells" id="cells"></span></div><button class="control" id="mainBtn">Дальше ▶</button><button class="control" id="restartBtn" aria-label="Начать заново" title="Начать заново">↻</button><button class="control" id="speedBtn">×1 ▶</button></div><div class="skills"></div></footer>
<nav class="scene-nav"><a href="/duels/mobile-horizontal" target="_top">↔ Команды</a><a href="/duels/treasure" target="_top">⚑ За сокровище</a></nav>
</main>
<script src="/assets/shared/runtime/figure-physics.js"></script><script src="/assets/shared/runtime/combat-mix.js"></script>
<script src="/assets/shared/runtime/treasure/treasure-geometry.js"></script><script src="/assets/shared/runtime/treasure/treasure-vegetables.js"></script><script src="/assets/shared/runtime/treasure/treasure-match.js"></script><script src="/assets/shared/runtime/treasure/treasure-setup.js"></script><script src="/assets/shared/runtime/treasure/treasure-team.js"></script><script src="/assets/shared/runtime/treasure/treasure-roles.js"></script><script src="/assets/shared/runtime/treasure/treasure-navigation.js"></script><script src="/assets/shared/runtime/treasure/treasure-sim.js"></script><script src="/assets/shared/runtime/treasure/treasure-view.js"></script><script src="/assets/shared/runtime/treasure/treasure-battle.js"></script>
</body></html>
